# Cloudflare Worker settings for the Early Access service. NOT deployed.
# Replace the database id after creating the database: `wrangler d1 create kinviva-early-access`.
# Secrets are never stored here. Set RATE_SALT with `wrangler secret put RATE_SALT`.
name = "kinviva-early-access"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://bhaktathapa.com.np"

[[d1_databases]]
binding = "DB"
database_name = "kinviva-early-access"
database_id = "REPLACE_WITH_DATABASE_ID"
