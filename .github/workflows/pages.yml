# Publishes the website in site/ to GitHub Pages:
# https://bhaktathapa.com.np/meetinglens-desktop/
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add shared media to the site
        run: |
          cp docs/media/meetinglens-demo.mp4 docs/media/meetinglens-demo-poster.jpg docs/media/architecture-hero.png site/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
