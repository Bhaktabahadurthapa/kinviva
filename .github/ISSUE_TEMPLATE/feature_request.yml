name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Pro and Business editions are planned and not available. Ideas for them are welcome too. Please do not include private content or keys.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A real situation helps most (a meeting, a class, an interview, an incident).
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like Kinviva to do?
