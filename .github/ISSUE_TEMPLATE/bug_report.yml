name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste real meeting content, transcripts, recordings, API keys or other people's private information.** Use sample data or redact it.
  - type: input
    id: version
    attributes:
      label: Kinviva version
      description: Shown in Settings, About.
      placeholder: "0.1.5"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple silicon), Windows 10 or 11 (experimental), Other]
    validations: { required: true }
  - type: input
    id: engine
    attributes:
      label: Answer engine and speech engine
      description: For example "local model through Ollama, built-in speech" or "cloud key, Deepgram". Do not include the key.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press Start\n2. ..."
