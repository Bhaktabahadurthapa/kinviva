<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingLens architecture</title>
  <!-- Source for docs/media/architecture-hero.png (diagram-design, Architecture, dark, MeetingLens skin). -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #110f0d; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1600px; display: block; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .sans { font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; }
    .mono { font-family: 'IBM Plex Mono', Menlo, monospace; }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 150 1600 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-hero-title architecture-hero-desc">
      <title id="architecture-hero-title">MeetingLens architecture</title>
      <desc id="architecture-hero-desc">Meeting audio from other participants and from your microphone is transcribed live, the assistant combines recent lines with matching document passages and asks a local or cloud language model, and answers appear on screen while meetings are saved on the device.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a8072"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5f2e"/></marker>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(242,234,219,0.07)"/>
        </pattern>
        <radialGradient id="glow" cx="0.18" cy="0.42" r="0.55">
          <stop offset="0" stop-color="#ff5f2e" stop-opacity="0.13"/>
          <stop offset="1" stop-color="#ff5f2e" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect y="150" width="1600" height="670" fill="#110f0d"/>
      <rect y="150" width="1600" height="670" fill="url(#dots)"/>
      <rect y="150" width="1600" height="670" fill="url(#glow)"/>

      <!-- ===== Title block ===== -->
      <text x="72" y="236" class="mono" font-size="13" fill="#ff5f2e" letter-spacing="0.2em">LOCAL-FIRST MEETING ASSISTANT</text>
      <text x="64" y="378" class="serif" font-size="150" font-weight="560" fill="#f2eadb" letter-spacing="-4">Meeting</text>
      <text x="66" y="520" class="serif" font-size="150" font-weight="380" font-style="italic" fill="#ff5f2e" letter-spacing="-3">Lens</text>
      <line x1="72" y1="566" x2="352" y2="566" stroke="#ff5f2e" stroke-width="2"/>
      <text x="72" y="612" class="serif" font-size="30" font-style="italic" fill="#f2eadb">Hear it. Understand it. Answer it.</text>
      <text x="72" y="652" class="mono" font-size="14" fill="#8a8072">live transcript · plain-English meaning · grounded replies</text>

      <!-- ===== Zone: capture ===== -->
      <rect x="600" y="184" width="220" height="236" rx="8" fill="rgba(242,234,219,0.02)" stroke="rgba(242,234,219,0.12)" stroke-width="0.8"/>
      <rect x="626" y="188" width="168" height="14" rx="2" fill="#110f0d"/>
      <text x="710" y="198.5" class="mono" font-size="9" fill="#8a8072" text-anchor="middle" letter-spacing="0.14em">CAPTURE · 2 CHANNELS</text>

      <!-- ===== Arrows (drawn before nodes) ===== -->
      <!-- Them -> STT -->
      <path d="M800,248 H827 Q835,248 835,256 V276 Q835,284 843,284 H868" fill="none" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Me -> STT -->
      <path d="M800,368 H827 Q835,368 835,360 V308 Q835,300 843,300 H868" fill="none" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- STT -> Transcript (headline path) -->
      <line x1="1050" y1="292" x2="1118" y2="292" stroke="#ff5f2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Transcript -> History -->
      <line x1="1300" y1="292" x2="1368" y2="292" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1310" y="268" width="48" height="13" rx="2" fill="#110f0d"/>
      <text x="1334" y="278" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">SAVE</text>
      <!-- Transcript -> Assistant -->
      <line x1="1210" y1="324" x2="1210" y2="458" stroke="#ff5f2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="1220" y="384" width="88" height="13" rx="2" fill="#110f0d"/>
      <text x="1264" y="394" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">RECENT LINES</text>
      <!-- Documents -> Assistant -->
      <line x1="1050" y1="492" x2="1118" y2="492" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1052" y="468" width="64" height="13" rx="2" fill="#110f0d"/>
      <text x="1084" y="478" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">PASSAGES</text>
      <!-- Assistant -> Model -->
      <line x1="1300" y1="476" x2="1368" y2="476" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1310" y="452" width="48" height="13" rx="2" fill="#110f0d"/>
      <text x="1334" y="462" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">PROMPT</text>
      <!-- Model -> Assistant (streamed, dashed) -->
      <line x1="1370" y1="508" x2="1302" y2="508" stroke="#8a8072" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="1310" y="518" width="48" height="13" rx="2" fill="#110f0d"/>
      <text x="1334" y="528" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">STREAM</text>
      <!-- Assistant -> Screen -->
      <line x1="1210" y1="524" x2="1210" y2="618" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1220" y="564" width="64" height="13" rx="2" fill="#110f0d"/>
      <text x="1252" y="574" class="mono" font-size="9" fill="#a99f8f" text-anchor="middle" letter-spacing="0.1em">ANSWERS</text>

      <!-- ===== Nodes ===== -->
      <!-- Them -->
      <rect x="620" y="216" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="620" y="216" width="180" height="64" rx="6" fill="#1b1814" stroke="#463e34" stroke-width="1"/>
      <rect x="632" y="226" width="40" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="652" y="236" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="632" y="257" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Them · system audio</text>
      <text x="632" y="272" class="mono" font-size="9.5" fill="#8a8072">SCREENCAPTUREKIT</text>
      <!-- Me -->
      <rect x="620" y="336" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="620" y="336" width="180" height="64" rx="6" fill="#1b1814" stroke="#9cc8a0" stroke-opacity="0.55" stroke-width="1"/>
      <rect x="632" y="346" width="40" height="13" rx="2" fill="none" stroke="#9cc8a0" stroke-opacity="0.55"/>
      <text x="652" y="356" class="mono" font-size="8" fill="#9cc8a0" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="632" y="377" class="sans" font-size="15" font-weight="600" fill="#9cc8a0">Me · microphone</text>
      <text x="632" y="392" class="mono" font-size="9.5" fill="#8a8072">CPAL · COREAUDIO</text>
      <!-- Speech-to-text (swappable provider: dashed) -->
      <rect x="870" y="260" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="870" y="260" width="180" height="64" rx="6" fill="#1b1814" stroke="#8a8072" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="882" y="270" width="48" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="906" y="280" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="882" y="301" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Speech-to-text</text>
      <text x="882" y="316" class="mono" font-size="9.5" fill="#8a8072">WHISPER.CPP · DEEPGRAM</text>
      <!-- Live transcript (focal) -->
      <rect x="1120" y="260" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="1120" y="260" width="180" height="64" rx="6" fill="rgba(255,95,46,0.10)" stroke="#ff5f2e" stroke-width="1.4"/>
      <rect x="1132" y="270" width="36" height="13" rx="2" fill="#ff5f2e"/>
      <text x="1150" y="280" class="mono" font-size="8" fill="#1c0b04" text-anchor="middle" letter-spacing="0.08em" font-weight="500">LIVE</text>
      <text x="1132" y="301" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Live transcript</text>
      <text x="1132" y="316" class="mono" font-size="9.5" fill="#d9a690">PARTIAL → FINAL</text>
      <!-- Meeting history -->
      <rect x="1370" y="260" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="1370" y="260" width="180" height="64" rx="6" fill="#15120f" stroke="#463e34" stroke-width="1"/>
      <rect x="1382" y="270" width="44" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="1404" y="280" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="1382" y="301" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Meeting history</text>
      <text x="1382" y="316" class="mono" font-size="9.5" fill="#8a8072">SQLITE · ON DEVICE</text>
      <!-- Documents -->
      <rect x="870" y="460" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="870" y="460" width="180" height="64" rx="6" fill="#15120f" stroke="#463e34" stroke-width="1"/>
      <rect x="882" y="470" width="56" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="910" y="480" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">CONTEXT</text>
      <text x="882" y="501" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Your documents</text>
      <text x="882" y="516" class="mono" font-size="9.5" fill="#8a8072">TXT · MD · PDF → FTS5</text>
      <!-- Assistant (focal) -->
      <rect x="1120" y="460" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="1120" y="460" width="180" height="64" rx="6" fill="rgba(255,95,46,0.10)" stroke="#ff5f2e" stroke-width="1.4"/>
      <rect x="1132" y="470" width="48" height="13" rx="2" fill="#ff5f2e"/>
      <text x="1156" y="480" class="mono" font-size="8" fill="#1c0b04" text-anchor="middle" letter-spacing="0.08em" font-weight="500">ASSIST</text>
      <text x="1132" y="501" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Assistant</text>
      <text x="1132" y="516" class="mono" font-size="9" fill="#d9a690">EXPLAIN·REPLY·RECAP·ASK</text>
      <!-- Language model (swappable provider: dashed) -->
      <rect x="1370" y="460" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="1370" y="460" width="180" height="64" rx="6" fill="#1b1814" stroke="#8a8072" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="1382" y="470" width="44" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="1404" y="480" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="1382" y="501" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Language model</text>
      <text x="1382" y="516" class="mono" font-size="9.5" fill="#8a8072">OLLAMA · OPENAI API</text>
      <!-- Screen -->
      <rect x="1120" y="620" width="180" height="64" rx="6" fill="#110f0d"/>
      <rect x="1120" y="620" width="180" height="64" rx="6" fill="#1b1814" stroke="#463e34" stroke-width="1"/>
      <rect x="1132" y="630" width="24" height="13" rx="2" fill="none" stroke="#463e34"/>
      <text x="1144" y="640" class="mono" font-size="8" fill="#a99f8f" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="1132" y="661" class="sans" font-size="15" font-weight="600" fill="#f2eadb">Window + overlay</text>
      <text x="1132" y="676" class="mono" font-size="9.5" fill="#8a8072">TAURI · REACT</text>

      <!-- ===== Legend strip ===== -->
      <line x1="600" y1="736" x2="1550" y2="736" stroke="#2e2923" stroke-width="1"/>
      <line x1="600" y1="764" x2="632" y2="764" stroke="#ff5f2e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="642" y="768" class="mono" font-size="10" fill="#8a8072">core path</text>
      <line x1="730" y1="764" x2="762" y2="764" stroke="#8a8072" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="772" y="768" class="mono" font-size="10" fill="#8a8072">data</text>
      <line x1="830" y1="764" x2="862" y2="764" stroke="#8a8072" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="872" y="768" class="mono" font-size="10" fill="#8a8072">streamed</text>
      <rect x="956" y="756" width="26" height="16" rx="3" fill="none" stroke="#8a8072" stroke-dasharray="4,3"/>
      <text x="992" y="768" class="mono" font-size="10" fill="#8a8072">local or cloud provider</text>
      <text x="1550" y="768" class="mono" font-size="10" fill="#8a8072" text-anchor="end">keys in OS keychain · no telemetry</text>
    </svg>
  </div>
</body>
</html>
